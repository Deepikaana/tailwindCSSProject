<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-clifford: #da373d;
      }
    </style>
    <title>Tailwind CSS project</title>
  </head>
  <body class="h-screen flex items-center justify-center">
    <div class="bg-blue-200 w-80 p-4 rounded shadow-md">
      <div class="text-2xl mb-4">Login</div>
      <form action="index.html">
        <div class="mb-4">
            <label for="">Email</label>
        <input name="email" id="email" class="border rounded p-2 w-full">
        </div>
         <div class="mb-4">
            <label for="">Password</label>
        <input name="password" id="password" class="border rounded p-2 w-full">
        </div>
        <div>
            <button class="bg-blue-600 p-2 w-full rounded">Login</button>
        </div>
        
      </form>
    </div>
  </body>
</html>
